name: exam_corrector
description: Mobile OMR Exam Corrector - captures a photo of a bubble sheet and grades it against an exam generated by the Exam Generator web app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP and networking
  http: ^1.1.0

  # Image handling
  image_picker: ^1.0.0

  # Permissions
  permission_handler: ^11.0.0

  # Local storage (remembers the server URL between launches)
  shared_preferences: ^2.1.0

  # Date formatting
  intl: ^0.18.0

  # Platform-specific
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
